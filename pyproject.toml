[project]
name = "nmr-particle-motion"
version = "0.1.0"
description = ""
authors = [
    {name = "Augustus Greenwood",email = "abg@unandup.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "opencv-python (>=4.13.0.90,<5.0.0.0)",
    "tqdm (>=4.67.1,<5.0.0)"
]

[tool.poetry]
packages = [{include = "nmr_particle_motion", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
